<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1% Mejor · el tema de la semana</title>
<meta name="description" content="Cada semana, un tema para crecer en 2 minutos: claves prácticas y un reto para aplicarlas.">
<!-- Vista previa al compartir el link (Teams, WhatsApp, Outlook) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="1% Mejor">
<meta property="og:title" content="1% Mejor · el tema de la semana">
<meta property="og:description" content="Un tema para crecer, cada semana, en 2 minutos: claves prácticas y un reto para aplicarlas.">
<meta property="og:url" content="https://nayrojas.github.io/1-mejor/clasica/">
<meta property="og:image" content="https://nayrojas.github.io/1-mejor/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f4e8c'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='24' fill='white' text-anchor='middle'%3E1%25%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta sobria: neutros + un único color de acento */
    --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f1f3f6;
    --text:#111827; --muted:#5b6474; --line:#e3e7ec;
    --accent:#1f4e8c; --accent-2:#3b6db3; --accent-tint:#edf2f9;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.18);
    --radius:18px;
    --head:"DM Sans",Inter,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#171a20; --surface-2:#1e222a;
      --text:#eef1f5; --muted:#a3abb8; --line:#2a2f38;
      --accent:#8fb3ea; --accent-2:#6f97d6; --accent-tint:#1b2433;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}


  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}

  /* Barra superior mínima */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:28px;height:28px;border-radius:50%;flex:none;
    background:var(--accent)}
  .brand-name{font-family:var(--head);font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .brand-name span{color:var(--accent)}
  .brand-tag{font-size:13px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line);white-space:nowrap}
  @media (max-width:560px){.brand-tag{display:none}}
  .right{display:flex;align-items:center;gap:8px}
  .lang{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:6px 10px;border-radius:999px;color:var(--muted);transition:background .2s,color .2s}
  .lang button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.12)}
  @media (max-width:520px){.top{flex-wrap:wrap;row-gap:12px}.right{width:100%;justify-content:space-between}}
  .week{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .week button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
  .week button:hover:not(:disabled){background:var(--surface-2)}
  .week button:disabled{opacity:.28;cursor:default}
  .week-label{text-align:center;min-width:96px;line-height:1.15}
  .week-label strong{display:block;font-size:13px;font-weight:600}
  .week-label small{font-size:11.5px;color:var(--muted)}

  /* ===== TEMA DE LA SEMANA: todo en una mirada ===== */
  .hero{display:grid;grid-template-columns:1fr;gap:28px;align-items:center;padding:26px 0 30px}
  @media (min-width:880px){.hero{grid-template-columns:5fr 6fr;gap:48px;padding:40px 0 36px}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent)}
  .hero h1{font-family:var(--head);font-weight:800;letter-spacing:-.03em;line-height:1.05;
    font-size:clamp(32px,4.4vw,46px);margin:10px 0 18px}
  .benefit{display:flex;gap:12px;align-items:flex-start;background:var(--accent-tint);border-radius:18px;padding:16px 18px}
  .benefit .ico{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:15px}
  .benefit small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .benefit p{font-family:var(--head);font-size:19px;font-weight:700;line-height:1.3;margin-top:2px}
  .past{display:none;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .past.on{display:block}

  /* Los 4 consejos como lista de lectura rápida */
  .tips ol{list-style:none}
  .tips{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  .tips-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;
    border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
  .tips li{display:flex;gap:16px;align-items:flex-start;padding:16px 22px;border-bottom:1px solid var(--line)}
  .tips li:last-child{border-bottom:0}
  .n{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);background:var(--surface-2)}
  .tips h3{font-family:var(--head);font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .tips p{color:var(--muted);font-size:15.5px;margin-top:2px}

  /* Reto */
  .reto{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;
    background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow)}
  .reto .txt{display:flex;gap:14px;align-items:center;min-width:0;flex:1 1 320px}
  .reto .big{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:var(--accent-tint)}
  .reto small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .reto h3{font-family:var(--head);font-size:19px;font-weight:800}
  .reto p{color:var(--muted);font-size:15.5px}
  .accept{flex:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:11px 20px;border-radius:999px;
    transition:transform .2s,background .2s}
  .accept:active{transform:scale(.95)}
  .accept.done{background:var(--accent-tint);color:var(--accent)}

  /* Tech: una línea secundaria */
  .tech{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow)}
  .tech .ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    color:var(--muted);background:var(--surface-2)}
  .tech .txt{flex:1 1 300px;min-width:0}
  .tech small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tech h3{font-family:var(--head);font-size:18px;font-weight:800;line-height:1.3}
  .tech p{color:var(--muted);font-size:15px}
  .tech .why{color:var(--text);margin-top:6px}
  .tech .why b{font-weight:600}
  .cta{flex:none;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14.5px;
    background:transparent;color:var(--accent);border:1px solid var(--line);padding:10px 18px;border-radius:999px;transition:gap .25s,background .2s}
  .cta:hover{gap:12px;background:var(--accent-tint)}

  .source{padding:12px 22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface-2)}
  .source b{font-weight:600;color:var(--text)}
  .quiz{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow)}
  .quiz small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .quiz h3{font-family:var(--head);font-size:17px;font-weight:700;margin:2px 0 12px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-size:14.5px;font-weight:500;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:background .2s,border-color .2s}
  .opt:hover:not(:disabled){border-color:var(--accent-2)}
  .opt:disabled{cursor:default}
  .opt.ok{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);font-weight:600}
  .opt.no{opacity:.55;text-decoration:line-through}
  .quiz .fb{margin-top:10px;font-size:14.5px;color:var(--muted);display:none}
  .quiz .fb.on{display:block}
  footer{padding:34px 0 36px;font-size:13.5px;color:var(--muted);text-align:center}
  footer strong{color:var(--text)}

  .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}

  .trail{position:fixed;left:0;top:0;z-index:40;pointer-events:none;white-space:nowrap;
    font:700 13px var(--head);color:var(--accent);will-change:transform,opacity;animation:trail .9s ease-out forwards}
  .trail.burst{font-size:16px;animation-duration:1.1s}
  @keyframes trail{
    from{opacity:.9;transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(1)}
    to{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) translate(-50%,-50%) scale(.6)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

  @media (prefers-color-scheme: dark){.accept,.benefit .ico{color:#0f1115}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="wrap">
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">1% <span>Mejor</span></span><span class="brand-tag" id="brandTag">un tema para crecer, cada semana</span></div>
      <div class="right">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true" title="Español">ES</button>
        <button type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
      </div>
      <nav class="week" aria-label="Cambiar de semana">
        <button id="prevWeek" aria-label="Semana anterior" title="Semana anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="week-label"><strong id="weekNum"></strong><small id="weekDates"></small></div>
        <button id="nextWeek" aria-label="Semana siguiente" title="Semana siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>
      </div>
    </header>

    <main id="main"></main>

    <footer><span id="footTxt">1% Mejor · un tema para crecer, cada semana, en 2 minutos · Creado por</span> <strong>Nay Rojas</strong></footer>
  </div>

<script src="../contenido.js"></script>
<script>
/* ================= Lógica (no necesitas tocarla) ================= */
const $ = s => document.querySelector(s);
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
let semana = 0;
let lang = "es";
try { if (localStorage.getItem("pulso-lang") === "en") lang = "en"; } catch (e) {}
const view = s => (lang === "en" && s.en) ? { ...s, ...s.en } : s;
function setLang(l) {
  lang = l;
  try { localStorage.setItem("pulso-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  const t = T[l];
  document.title = t.title;
  $("#brandTag").textContent = t.tag; $("#footTxt").textContent = t.foot;
  $(".week").setAttribute("aria-label", t.nav);
  for (const [id, k] of [["#prevWeek", "prev"], ["#nextWeek", "next"]]) { $(id).setAttribute("aria-label", t[k]); $(id).title = t[k]; }
  render();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
const retoAceptado = n => { try { return localStorage.getItem("pulso-reto-" + n) === "1"; } catch (e) { return false; } };

function render() {
  const s = view(SEMANAS[semana]), d = s.soft, t = s.tech, ok = retoAceptado(s.numero), L = T[lang];
  $("#weekNum").textContent = `${L.week} ${s.numero}`;
  $("#weekDates").textContent = s.fechas;
  $("#prevWeek").disabled = semana === SEMANAS.length - 1;
  $("#nextWeek").disabled = semana === 0;

  $("#main").innerHTML = `
    <section class="hero">
      <div class="rise">
        <span class="eyebrow">${semana === 0 ? L.now : L.past} · ${d.categoria}</span>
        <h1>${d.titulo}</h1>
        <div class="benefit">
          <span class="ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
          <div><small>${L.helps}</small><p>${d.ayuda || ""}</p></div>
        </div>
        <p class="past ${semana === 0 ? "" : "on"}">${L.pastNote}</p>
      </div>
      <div class="tips rise" style="animation-delay:.12s">
        <div class="tips-head"><span>${L.keys(d.tips.length)}</span><span>${L.read}</span></div>
        <ol>${d.tips.map((x, i) => `
          <li><span class="n">${i + 1}</span><div><h3>${x.titulo}</h3><p>${x.texto}</p></div></li>`).join("")}
        </ol>
        ${d.fuente ? `<div class="source">${L.inspired} <b>${d.fuente}</b></div>` : ""}
      </div>
    </section>

    <div class="reto rise" style="animation-delay:.2s">
      <div class="txt">
        <span class="big" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>
        <div><small>${L.reto}</small><h3>${d.reto.titulo}</h3><p>${d.reto.texto}</p></div>
      </div>
      <button class="accept${ok ? " done" : ""}">${ok ? L.accepted : L.accept}</button>
    </div>

    ${s.repaso ? `<div class="quiz rise" style="animation-delay:.24s">
      <small>${L.quiz}</small>
      <h3>${s.repaso.pregunta}</h3>
      <div class="opts">${s.repaso.opciones.map((o, i) => `<button class="opt" type="button" data-i="${i}">${o}</button>`).join("")}</div>
      <p class="fb" aria-live="polite"></p>
    </div>` : ""}

    ${t ? `<div class="tech rise" style="animation-delay:.28s">
      <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg></span>
      <div class="txt">
        <small>${L.tech} · ${t.etiqueta}</small>
        <h3>${t.titulo}</h3>
        <p>${t.resumen}</p>
        ${t.porQue ? `<p class="why"><b>${L.why}</b> ${t.porQue}</p>` : ""}
      </div>
      <a class="cta" href="${t.link.url}" target="_blank" rel="noopener">${t.link.texto} <span aria-hidden="true">→</span></a>
    </div>` : ""}`;

  document.querySelectorAll(".opt").forEach(o => o.onclick = () => {
    const i = +o.dataset.i, rp = s.repaso, fb = $(".quiz .fb");
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === rp.correcta) x.classList.add("ok"); else if (x === o) x.classList.add("no"); });
    fb.textContent = (i === rp.correcta ? L.ok : L.no) + rp.explica;
    fb.classList.add("on");
  });
  const btn = $(".accept");
  btn.onclick = () => {
    const r = btn.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2);
    if (navigator.vibrate) navigator.vibrate(30);
    btn.classList.add("done"); btn.textContent = L.accepted;
    try { localStorage.setItem("pulso-reto-" + s.numero, "1"); } catch (e) {}
  };
}
$("#prevWeek").onclick = () => { semana++; render(); };
$("#nextWeek").onclick = () => { semana--; render(); };

/* Confeti del reto */
const cv = $("#confetti"), ctx = cv.getContext("2d");
let bits = [], running = false;
function confetti(x, y) {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--accent", "--accent-2", "--accent"].map(v => cs.getPropertyValue(v).trim()).concat(["#c7d4e6", "#94a3b8"]);
  for (let i = 0, n = REDUCE ? 50 : 140; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: Math.random() * 6,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length], life: 1 });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  bits = bits.filter(b => b.life > 0 && b.y < innerHeight + 20);
  bits.forEach(b => {
    b.vy += 0.32; b.vx *= 0.985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= 0.008;
    ctx.save(); ctx.globalAlpha = Math.max(0, b.life); ctx.translate(b.x, b.y); ctx.rotate(b.r);
    ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2)) + 1);
    ctx.restore();
  });
  if (bits.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* Estela del 1%: al mover el mouse y al hacer clic */
if (!REDUCE) {
  let lx = -99, ly = -99, alive = 0;
  const spawn = (x, y, dx, dy, cls) => {
    if (alive > 40) return;
    const el = document.createElement("span");
    el.className = "trail" + (cls ? " " + cls : ""); el.textContent = "1%"; el.setAttribute("aria-hidden", "true");
    el.style.setProperty("--x", x + "px"); el.style.setProperty("--y", y + "px");
    el.style.setProperty("--dx", dx + "px"); el.style.setProperty("--dy", dy + "px");
    alive++; el.addEventListener("animationend", () => { el.remove(); alive--; });
    document.body.appendChild(el);
  };
  addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" || Math.hypot(e.clientX - lx, e.clientY - ly) < 38) return;
    lx = e.clientX; ly = e.clientY;
    spawn(lx, ly, (Math.random() - 0.5) * 20, 18 + Math.random() * 14);
  }, { passive: true });
  addEventListener("pointerdown", e => {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.random() * 0.4, d = 46 + Math.random() * 24;
      spawn(e.clientX, e.clientY, Math.cos(a) * d, Math.sin(a) * d, "burst");
    }
  }, { passive: true });
}

setLang(lang);
</script>
</body>
</html>
